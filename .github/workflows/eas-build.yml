name: EAS Build Manual Stub

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Build Platform'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios
      profile:
        description: 'EAS Build Profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - development
          - preview
          - production

jobs:
  build:
    name: Trigger EAS Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup EAS CLI
        run: pnpm dlx eas-cli --version

      - name: EAS Build (Stub)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "Triggering EAS build on platform=${{ inputs.platform }} with profile=${{ inputs.profile }}"
          # When EXPO_TOKEN is configured in GitHub secrets:
          # pnpm dlx eas-cli build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive
